<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ef">
<title>OSAKA 2026 · 一個人的大阪</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#181818;--muted:#77736d;--line:#e7e2da;--accent:#e9684e;--soft:#f1eee8;--blue:#4967c8;--green:#27845c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;border:0;background:none;color:inherit}a{color:inherit;text-decoration:none}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:20;background:#f6f4efee;backdrop-filter:blur(18px);padding:14px 17px 10px;border-bottom:1px solid #e7e2da99}.toprow{display:flex;align-items:center;justify-content:space-between}.logo{font-size:15px;font-weight:900;letter-spacing:.08em}.logo i{color:var(--accent);font-style:normal}.meta{font-size:11px;color:var(--muted)}.icon{width:34px;height:34px;border:1px solid var(--line);border-radius:12px;background:#fff}.hero{padding:20px 17px 8px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:900}.hero h1{font-size:34px;line-height:1.05;margin:6px 0}.hero p{font-size:13px;color:var(--muted);margin:0}.chips{display:flex;gap:7px;overflow:auto;padding:16px 17px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.daychip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 13px;text-align:left;min-width:62px}.daychip b{display:block;font-size:12px}.daychip small{color:var(--muted);font-size:10px}.daychip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.daychip.active small{color:#ddd}.view{padding:5px 17px}.daytitle{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 14px}.daytitle h2{font-size:21px;margin:0}.daytitle span{font-size:11px;color:var(--muted)}.map{height:150px;border-radius:20px;background:linear-gradient(145deg,#e9eee9,#dfe8e6);border:1px solid var(--line);position:relative;overflow:hidden;margin-bottom:17px}.map:before,.map:after{content:"";position:absolute;background:#fff9;border-radius:50%;transform:rotate(-20deg)}.map:before{width:150%;height:2px;left:-20%;top:52%;box-shadow:0 35px #fff8,0 -32px #fff8}.map:after{width:120px;height:70px;background:#cfe3e5;right:-25px;top:-20px}.route{position:absolute;left:16%;top:55%;width:68%;height:3px;background:var(--accent);transform:rotate(-10deg);border-radius:5px}.pin{position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;border:3px solid var(--accent);display:grid;place-items:center;font-size:9px;font-weight:900;box-shadow:0 4px 10px #0002}.p1{left:13%;top:61%}.p2{left:38%;top:42%}.p3{left:63%;top:48%}.p4{left:79%;top:29%;border-color:var(--blue)}.maplabel{position:absolute;left:12px;top:11px;background:#ffffffdf;border-radius:9px;padding:6px 9px;font-size:10px;font-weight:800;z-index:2}.maplink{position:absolute;right:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:10px;z-index:2}.timeline{position:relative}.timeline:before{content:"";position:absolute;left:17px;top:7px;bottom:7px;width:2px;background:#dedbd5}.stop{display:grid;grid-template-columns:35px 1fr;gap:10px;position:relative;margin-bottom:11px}.dot{width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);margin-top:15px;z-index:1}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px 14px;box-shadow:0 5px 18px #00000007}.stophead{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:10px}.time{color:var(--blue);font-weight:900}.card h3{font-size:15px;margin:5px 0 3px}.card p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.action{background:var(--soft);border-radius:9px;padding:6px 8px;font-size:10px}.action.mapbtn{color:var(--blue)}.transport{margin:0 0 10px 45px;color:var(--muted);font-size:10px}.panel{display:none;padding:12px 17px}.panel.active{display:block}.sectioncard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}.sectioncard h3{font-size:15px;margin:0 0 6px}.sectioncard p{font-size:11px;color:var(--muted);margin:0;line-height:1.6}.eventdate{color:var(--accent);font-size:10px;font-weight:900}.check{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.check:last-child{border:0}.check input{width:19px;height:19px;accent-color:var(--accent)}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);height:70px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30}.navbtn{font-size:10px;color:var(--muted);border-radius:13px}.navbtn strong{display:block;font-size:19px;line-height:22px}.navbtn.active{color:var(--accent);font-weight:900;background:#fff3ef}.hotel{border:1px dashed #c9c4bc;background:#faf9f6}.dark{--bg:#171716;--card:#242422;--ink:#f4f2ee;--muted:#aaa69f;--line:#3a3936;--soft:#302f2c}.dark .top,.dark .bottom{background:#171716ee}.dark .daychip{background:#242422}.dark .map{background:#27302e}.dark .maplabel,.dark .maplink{background:#242422}.dark .sectioncard{background:#242422}.toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,10px);opacity:0;background:#191919;color:#fff;padding:10px 14px;border-radius:12px;font-size:11px;z-index:50;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body><div class="app">
<header class="top"><div class="toprow"><div class="logo">TREK<i>·</i>OSAKA</div><div class="meta">10/21 — 10/29 · 1人</div><button class="icon" onclick="toggleDark()">◐</button></div></header>
<section class="hero"><div class="eyebrow">JAPAN · 2026</div><h1>一個人的大阪</h1><p>大阪為主｜京都・奈良一日遊｜USJ 不去</p></section>
<div id="daychips" class="chips"></div>
<main id="plan" class="view"></main>
<section id="events" class="panel"></section>
<section id="prep" class="panel"></section>
<nav class="bottom"><button class="navbtn active" onclick="nav('plan',this)"><strong>⌂</strong>行程</button><button class="navbtn" onclick="nav('days',this)"><strong>☰</strong>天數</button><button class="navbtn" onclick="nav('events',this)"><strong>✦</strong>活動</button><button class="navbtn" onclick="nav('prep',this)"><strong>✓</strong>清單</button></nav><div id="toast" class="toast"></div>
</div>
<script>
const days=[
{d:'10/21',title:'抵達大阪 → 難波夜景',tag:'✈️ 輕鬆開局',stops:[['抵達','關西機場 → 飯店','Check-in、放行李。'],['17:00','心齋橋','逛街、熟悉周邊。'],['19:00','道頓堀','章魚燒／御好燒／串炸。']]},
{d:'10/22',title:'大阪城 → 黑門 → 新世界',tag:'🏯 市區經典',stops:[['09:00','大阪城公園','公園＋天守閣。'],['12:00','黑門市場','午餐＋海鮮／和牛小吃。'],['15:00','日本橋・電電城','動漫、電器、模型。'],['18:00','新世界・通天閣','晚上吃串炸。']]},
{d:'10/23',title:'大阪深度日 → 中之島夜景',tag:'🌃 光影',stops:[['10:00','大阪生活今昔館／天神橋筋','生活感的大阪。'],['15:00','梅田或中之島','咖啡、逛街，留體力。'],['18:00','NAKANOSHIMA ART LIGHTS','2026/10/16–10/25。']]},
{d:'10/24',title:'萬博記念公園 → 中之島',tag:'🎵 活動日',stops:[['上午','萬博記念公園','依當日活動安排；Chillin’ Vibes 可考慮。'],['16:30','回大阪市區','晚餐前回市區。'],['19:00','中之島 Night Glow & Music','依當日公告安排。']]},
{d:'10/25',title:'京都一日遊',tag:'⛩️ 古都',stops:[['08:00','大阪 → 京都','早點出發避開人潮。'],['09:30','清水寺 → 二年坂・三年坂','一路往祇園方向。'],['15:00','八坂神社 → 祇園 → 河原町','晚餐後回大阪。']]},
{d:'10/26',title:'梅田 → 夜景',tag:'🛍️ 放鬆',stops:[['11:00','梅田購物','GRAND FRONT、LUCUA、百貨。'],['17:00','梅田藍天大廈','傍晚看大阪夜景。'],['19:00','梅田晚餐','休息日。']]},
{d:'10/27',title:'奈良一日遊',tag:'🦌 鹿＋古蹟',stops:[['09:00','大阪 → 奈良','奈良公園、餵鹿。'],['11:00','東大寺','大佛殿＋周邊。'],['14:00','春日大社 → 奈良町','傍晚回大阪。']]},
{d:'10/28',title:'大阪自由日',tag:'☕ 彈性',stops:[['上午','睡晚一點','留一天緩衝。'],['下午','三選一','日本橋動漫／心齋橋購物／中之島散步。'],['晚上','一人好好吃一餐','燒肉、居酒屋或想吃的店。']]},
{d:'10/29',title:'最後採買 → 關西機場',tag:'✈️ 回台',stops:[['上午','Check-out＋最後採買','預留行李與交通時間。'],['依航班','前往關西機場','航班確定後再精算。']]}
];
let current=0;
const chips=document.getElementById('daychips');days.forEach((x,i)=>{let b=document.createElement('button');b.className='daychip'+(i===0?' active':'');b.innerHTML=`<b>${x.d}</b><small>DAY ${i+1}</small>`;b.onclick=()=>selectDay(i);chips.appendChild(b)});
function selectDay(i){current=i;document.querySelectorAll('.daychip').forEach((b,n)=>b.classList.toggle('active',n===i));renderPlan();document.getElementById('plan').scrollIntoView({block:'start'});}
function renderPlan(){const x=days[current];let html=`<div class="daytitle"><div><h2>DAY ${current+1} · ${x.d}</h2><span>${x.title}</span></div><span>${x.tag}</span></div><div class="map"><div class="maplabel">📍 ${x.title}</div><div class="route"></div><span class="pin p1">1</span><span class="pin p2">2</span><span class="pin p3">3</span><span class="pin p4">4</span><a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.title)}" target="_blank">Google Maps ↗</a></div><div class="timeline">`;
x.stops.forEach((s,i)=>{html+=`<article class="stop"><i class="dot"></i><div class="card"><div class="stophead"><span class="time">${s[0]}</span><span>STOP ${i+1}</span></div><h3>${s[1]}</h3><p>${s[2]}</p><div class="actions"><a class="action mapbtn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s[1])}">📍 地圖</a>${i<x.stops.length-1?'<button class="action" onclick="toast(\'住宿訂好後再精算交通\')">🚃 交通</button>':''}</div></div></article>`});html+='</div>';
if(current===0||current===8)html+=`<div class="sectioncard hotel"><h3>${current===0?'🏨 住宿':'✈️ 航班'}</h3><p>尚未設定。你訂好後把飯店／航班資料給我，我會直接補進這裡並重算交通。</p></div>`;document.getElementById('plan').innerHTML=html}
function nav(which,btn){document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['plan','events','prep'].forEach(id=>document.getElementById(id).classList.toggle('panel',id!==which));if(which==='plan'){document.getElementById('plan').className='view';document.getElementById('events').style.display='none';document.getElementById('prep').style.display='none';document.getElementById('daychips').style.display='flex';renderPlan()}else if(which==='days'){document.getElementById('plan').className='view';document.getElementById('events').style.display='none';document.getElementById('prep').style.display='none';document.getElementById('daychips').style.display='flex';renderPlan();document.getElementById('daychips').scrollIntoView({block:'start'})}else{document.getElementById('plan').style.display='none';document.getElementById('daychips').style.display='none';document.getElementById(which).style.display='block';}}
function openEvents(){document.getElementById('events').innerHTML=`<div class="sectioncard"><div class="eventdate">10/16 — 10/25</div><h3>💡 NAKANOSHIMA ART LIGHTS 2026</h3><p>10/23–10/25 可安排，適合接在中之島散步後。</p></div><div class="sectioncard"><div class="eventdate">10/24</div><h3>🎵 萬博記念公園／Chillin’ Vibes</h3><p>若決定參加，當天就不要再塞太多景點。</p></div><div class="sectioncard"><div class="eventdate">8/28 — 11/1</div><h3>☁️ なんば雲海</h3><p>整段旅程都在活動期間，可當晚間散步備選。</p></div><div class="sectioncard"><div class="eventdate">10/21 — 10/31</div><h3>🖼️ 真・仮面ライダー系展覽</h3><p>大阪會場，可依興趣加入。</p></div><div class="sectioncard"><h3>🎆 煙火</h3><p>目前 10/21–10/29 沒有找到適合硬塞的大型煙火。若延長到 10/31，再重新追蹤大阪藝術煙火。</p></div>`}
function openPrep(){document.getElementById('prep').innerHTML=`<div class="sectioncard"><h3>出發前 Checklist</h3>${['飯店','去程航班','回程航班','eSIM／網路','旅遊保險','信用卡／現金','護照與入境資料','JR／交通票券確認','Google Maps 離線資料','最後確認活動票券'].map((x,i)=>`<label class="check"><input type="checkbox" data-k="c${i}" onchange="saveCheck(this)"><span>${x}</span></label>`).join('')}</div><div class="sectioncard"><h3>📦 單機模式</h3><p>Checklist 勾選狀態存在這台手機的瀏覽器，不需要帳號，也沒有後端。</p></div>`;document.querySelectorAll('.check input').forEach(x=>x.checked=localStorage.getItem(x.dataset.k)==='1')}
function saveCheck(el){localStorage.setItem(el.dataset.k,el.checked?'1':'0');toast(el.checked?'已完成 ✓':'已取消')}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark')?'1':'0')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1800)}
if(localStorage.getItem('dark')==='1')document.body.classList.add('dark');openEvents();openPrep();renderPlan();
</script></body></html>
